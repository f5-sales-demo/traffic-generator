title = "Fleet default Gitleaks rules"

[extend]
useDefault = true

[[rules]]
id = "azure-subscription-id"
description = "Azure subscription identifiers must not be committed"
regex = '''(?i)(?:subscription[_-]?id|azure_subscription_id|--subscription|/subscriptions/)[^0-9a-f]{0,32}[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["azure", "infrastructure-identifier", "pii"]

[rules.allowlist]
description = "Documented non-live Azure subscription placeholders"
regexTarget = "match"
regexes = [
  '''00000000-0000-0000-0000-000000000000''',
  '''00000000-0000-4000-8000-[0-9a-f]{12}''',
]

# Prefixed tokens identify themselves; public commit hashes are not credentials.
[[rules]]
id = "sourcegraph-access-token"
description = "Sourcegraph access tokens with an identifying prefix"
regex = '''(?i)\b(sgp_(?:[a-f0-9]{16}|local)_[a-f0-9]{40}|sgp_[a-f0-9]{40})\b(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["sgp_"]

# Legacy bare tokens require a credential context, not a file-wide keyword.
[[rules]]
id = "sourcegraph-legacy-access-token"
description = "Legacy Sourcegraph tokens in credential assignments, flags or headers"
regex = '''(?i)(?:\b(?:sourcegraph(?:[_-]?(?:api|access))?[_-]?(?:token|secret|key)?|(?:api|access)[_-]?token|token|secret|authorization)[\x60'"\s]*[:=][\x60'"\s]*|--(?:sourcegraph-)?token(?:=|\s+)[\x60'"]*|\b(?:bearer|token)\s+[\x60'"]*)([a-f0-9]{40})\b(?:[\x60'"\s;]|\\[nr]|$)'''
entropy = 3
keywords = ["sourcegraph", "token", "secret", "authorization", "bearer"]
