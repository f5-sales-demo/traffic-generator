---
name: GitHub Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'documentation/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  docs:
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@276b522810ed9fb3d91c9762d874a600fa637bbe
    with:
      builder-image: ${{ github.repository == 'f5-sales-demo/gitops' && 'ghcr.io/f5-sales-demo/docs-builder@sha256:8b401e2d62b43187ad134b5253de6095cf9273f6a293cec8a326e3103730b902' || github.repository == 'f5-sales-demo/statistics' && 'ghcr.io/f5-sales-demo/docs-builder@sha256:230952b9a8b4e2a1f9937f2af7682428ae217e422b52909374da15f7f1b5c77c' || github.repository == 'f5-sales-demo/custom-responses' && 'ghcr.io/f5-sales-demo/docs-builder@sha256:eaf57b7f92b26ab11e69420564dad4d3ad194ac7203ed7e292a04a230ed83d29' || 'ghcr.io/f5-sales-demo/docs-builder@sha256:8e3cc0f417f2fd658a07a0ee06b440bb49a02398f9d7657daa26f78dec667cbe' }}
      shared-mode: auto
      content-ref: ${{ github.sha }}
      content-path: ${{ github.repository == 'f5-sales-demo/terraform-provider-xcsh' && 'documentation' || 'docs' }}
      socketless_runner_label: managed-socketless
      container_build_runner_label: managed-container-build
    permissions:
      contents: read # read documentation sources
      packages: read # pull the fleet documentation builder image
      pages: write # publish the built Pages artifact
      id-token: write # authenticate the Pages deployment
