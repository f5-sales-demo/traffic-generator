---
name: GitHub Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'documentation/**'
      - 'terraform/**'
      - 'wingman/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  docs:
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@6a3c539235ab5ee327d3736c678f48181349de04
    with:
      # Certificate Management uses scoped lifecycle navigation, TOCs, and session personalization.
      builder-image: ${{ github.repository == 'f5-sales-demo/certificate-management' && 'ghcr.io/f5-sales-demo/docs-builder@sha256:20185a1fccb2f5a58d6a4405af1cec16e21714d15740d63ce5ae4d97db103118' || 'ghcr.io/f5-sales-demo/docs-builder@sha256:8fcc5e4171f6b4cb44133e44619aaca352d168b5a34e0c95a5715041d721bcda' }}
      docs-title: ${{ github.repository == 'f5-sales-demo/certificate-management' && 'Certificate Management' || '' }}
      shared-mode: auto
      content-ref: ${{ github.sha }}
      content-path: ${{ github.repository == 'f5-sales-demo/terraform-provider-xcsh' && 'documentation' || 'docs' }}
      socketless_runner_label: managed-socketless
      container_build_runner_label: managed-container-build
    permissions:
      contents: read # read documentation sources
      packages: read # pull the fleet documentation builder image
      pages: write # publish the built Pages artifact
      id-token: write # authenticate the Pages deployment
