---
name: Require Linked Issue

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions: {}

concurrency:
  group: require-linked-issue-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-linked-issues:
    # The central reconciler creates and links its issue before it attests this
    # exact commit. Developer-authored pull requests retain the live API check.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'governance/reconcile-')
    name: Check linked issues
    runs-on: managed-socketless
    permissions:
      pull-requests: read # inspect linked issues on the current pull request
    steps:
      - name: Check this pull request's linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_AUTOMATION_LOGIN: ${{ vars.RELEASE_AUTOMATION_LOGIN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const number = pull.number;
            const branchMatch = pull.head?.ref?.match(
              /^release\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            );
            const titleMatch = pull.title?.match(
              /^chore: bump version to v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            );
            const generatedRelease =
              Boolean(branchMatch && titleMatch) &&
              pull.head?.repo?.full_name === `${owner}/${repo}` &&
              Boolean(process.env.RELEASE_AUTOMATION_LOGIN) &&
              pull.user?.login === process.env.RELEASE_AUTOMATION_LOGIN &&
              pull.body?.startsWith("Automated release PR generated by ") &&
              pull.body.includes("scripts/release.ts") &&
              branchMatch?.slice(1).join(".") === titleMatch?.slice(1).join(".");
            if (generatedRelease) {
              core.info(`PR #${number} is authenticated generated release v${branchMatch.slice(1).join(".")}; linked-issue policy is satisfied.`);
              return;
            }
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) { nodes { number } }
                  }
                }
              }`,
              { owner, repo, number },
            );
            const linked = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (linked.length === 0) {
              core.setFailed("Pull request must link a GitHub issue. Add 'Closes #123' to the PR description or link an issue from the sidebar.");
            } else {
              core.info(`PR #${number} links issue #${linked[0].number}`);
            }
