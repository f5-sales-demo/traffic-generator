---
# Managed by docs-control. Verifies that translations stay fresh when
# English docs change. Generation happens via Antigravity (antigravity-translate.yml);
# this gate only audits sourceHash freshness (no API calls).
name: Translation Audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit:
    # Read-only freshness audit — no secrets required.
    #
    # Cost-bearing generation and its audit remain positive-gated by the same
    # organization variable. The reusable audit then applies the deterministic
    # next-major release policy: ordinary development and minor/patch releases
    # report successful/not-applicable, while release/vN.0.0 validates the full
    # reconciled corpus.
    #
    # `vars` is used rather than `env` because the `env` context is not available
    # in a job-level `if:`. An unset variable evaluates false, so this fails safe
    # toward not spending money. The audit stays advisory because this job can
    # skip when the runtime switch is disabled.
    if: vars.TRANSLATIONS_ENABLED == 'true'
    uses: f5-sales-demo/docs-control/.github/workflows/translation-audit.yml@6cfbb2366027be050ae7d3e7e069e94ff445363d
