---
name: Super-Linter

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    if: >-
      github.repository == 'f5-sales-demo/xcsh' &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ github.repository == 'f5-sales-demo/xcsh' && 'Check linked issues' || 'xcsh linked issue (not applicable)' }}
    runs-on: ${{ github.repository == 'f5-sales-demo/xcsh' && 'xcsh-socketless' || 'managed-socketless' }}
    permissions:
      pull-requests: read # inspect linked issues or authenticated release metadata
    steps:
      - name: Check this pull request's linked issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_AUTOMATION_LOGIN: ${{ vars.RELEASE_AUTOMATION_LOGIN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull = context.payload.pull_request;
            const number = pull.number;
            const branchMatch = pull.head?.ref?.match(
              /^release\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            );
            const titleMatch = pull.title?.match(
              /^chore: bump version to v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/,
            );
            const generatedRelease =
              Boolean(branchMatch && titleMatch) &&
              pull.head?.repo?.full_name === `${owner}/${repo}` &&
              Boolean(process.env.RELEASE_AUTOMATION_LOGIN) &&
              pull.user?.login === process.env.RELEASE_AUTOMATION_LOGIN &&
              pull.body?.startsWith("Automated release PR generated by ") &&
              pull.body.includes("scripts/release.ts") &&
              branchMatch?.slice(1).join(".") === titleMatch?.slice(1).join(".");
            if (generatedRelease) {
              core.info(`PR #${number} is authenticated generated release v${branchMatch.slice(1).join(".")}; linked-issue policy is satisfied.`);
              return;
            }
            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 1) { nodes { number } }
                  }
                }
              }`,
              { owner, repo, number },
            );
            const linked = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (linked.length === 0) {
              core.setFailed("Pull request must link a GitHub issue. Add 'Closes #123' to the PR description or link an issue from the sidebar.");
            } else {
              core.info(`PR #${number} links issue #${linked[0].number}`);
            }

  lint:
    needs: linked-issue
    # Central reconciliation commits contain only canonical blobs that already
    # passed docs-control lint and review. The reconciler attests this exact
    # commit under the two required lint contexts, so do not schedule the
    # Docker-heavy reusable workflow a second time downstream.
    if: >-
      always() &&
      !startsWith(github.event.pull_request.head.ref, 'governance/reconcile-') &&
      (github.repository != 'f5-sales-demo/xcsh' || needs.linked-issue.result == 'success')
    # No `secrets:` — least privilege. The reusable uses only the automatic
    # GITHUB_TOKEN, so passing repository secrets would over-provision it.
    uses: f5-sales-demo/docs-control/.github/workflows/super-linter.yml@0fb275d851e2246b0f7b47278183512afd597c24
    with:
      rust_edition: ${{ github.repository == 'f5-sales-demo/xcsh' && '2024' || '2021' }}
      classify_xc_minimum_configs: ${{ github.repository == 'f5-sales-demo/terraform-provider-xcsh' }}
      socketless_runner_label: ${{ github.repository == 'f5-sales-demo/xcsh' && 'xcsh-socketless' || 'managed-socketless' }}
      container_build_runner_label: ${{ github.repository == 'f5-sales-demo/xcsh' && 'xcsh-container-build' || 'managed-container-build' }}
    permissions:
      contents: read # checkout repository content in the reusable workflow
      packages: read # pull lint tooling from GitHub Packages
      statuses: write # publish the lint status context
      pull-requests: write # annotate pull requests with lint results
