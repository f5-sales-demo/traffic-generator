---
name: Dependabot Auto-Merge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Approve and enable auto-merge
    runs-on: [self-hosted, Linux, X64, "${{ github.event.repository.name }}", ubuntu-24.04]
    permissions:
      contents: write # merge validated Dependabot updates
      pull-requests: write # approve pull requests and enable auto-merge
    steps:
      - name: Process open Dependabot pull requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const DEPENDABOT_ID = 49699333;
            const GITHUB_ACTIONS_ID = 41898282;
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            for (const pull of pulls) {
              if (pull.user?.id !== DEPENDABOT_ID) continue;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const headApproved = reviews.some(
                (review) =>
                  review.user?.id === GITHUB_ACTIONS_ID &&
                  review.state === "APPROVED" &&
                  review.commit_id === pull.head.sha,
              );
              if (!headApproved) {
                await github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number: pull.number,
                  commit_id: pull.head.sha,
                  event: "APPROVE",
                });
              }

              if (pull.auto_merge) continue;
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) { pullRequest { number } }
                }`,
                { pullRequestId: pull.node_id },
              );
            }
