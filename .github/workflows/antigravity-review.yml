---
# Governed caller for the Antigravity Gemini PR reviewer. Synced by docs-control managed-files
# to opted-in repositories only.
# Invokes the shared reusable reviewer in docs-control at a commit-pinned SHA.
name: Antigravity AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # SUSPENDED: Gemini Antigravity review is opt-in while its quota is exhausted.
    # Runs only if explicitly enabled, the PR head repository is the same as the
    # base repository, and the event is not triggered on an automated branch.
    if: >-
      vars.ANTIGRAVITY_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(startsWith(github.head_ref, 'governance/') ||
        startsWith(github.head_ref, 'sync/') ||
        startsWith(github.head_ref, 'release/') ||
        startsWith(github.head_ref, 'openapi-sync/') ||
        startsWith(github.head_ref, 'plugin-sync/') ||
        startsWith(github.head_ref, 'deps/') ||
        startsWith(github.head_ref, 'docs/update-') ||
        startsWith(github.head_ref, 'auto-regenerate/') ||
        startsWith(github.head_ref, 'auto-generate/') ||
        startsWith(github.head_ref, 'autoresearch/') ||
        (startsWith(github.head_ref, 'dependabot/') && github.actor == 'dependabot[bot]'))
    uses: f5-sales-demo/docs-control/.github/workflows/antigravity-review.yml@ac6108ea50661324c9da55ee7d1a6fd735a6de01
    permissions:
      contents: read
      pull-requests: write
      issues: write
    secrets:
      ANTIGRAVITY_TOKEN: ${{ secrets.ANTIGRAVITY_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
