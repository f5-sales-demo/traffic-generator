---
self-hosted-runner:
  labels:
    - administration
    - api-protection
    - api-specs
    - api-specs-enriched
    - apt-repo
    - automation
    - bot-advanced
    - bot-standard
    - cdn
    - cdn-simulator
    - console
    - container-build
    - csd
    - ddos
    - demo-resource-template
    - demo-resources
    - devcontainer
    - dns
    - docs
    - docs-builder
    - docs-control
    - docs-icons
    - docs-theme
    - fixture
    - i18n-core
    - marketplace
    - marketplace-claude-code
    - mcn
    - nginx
    - observability
    - origin-server
    - starlight-llms-txt
    - starlight-mega-menu
    - terraform-provider-xcsh
    - traffic-generator
    - ubuntu-24.04-arm
    - vscode-xcsh
    - waf
    - was
    - webapp-api-protection
    - xcsh
    - xcsh-action
    - xcsh-chrome-extension

config-variables: null

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # Embedded workflow shell is also linted by actionlint, which does not
      # load the repository ShellCheck configuration. Keep style/info findings
      # in the dedicated shell policy while retaining all error-level checks.
      - "shellcheck reported issue in this script: SC2002:.+"
      - "shellcheck reported issue in this script: SC2015:.+"
      - "shellcheck reported issue in this script: SC2016:.+"
  .github/workflows/enforce-repo-settings.yml:
    ignore:
      - 'property "repo_settings_token" is not defined'
